[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-service"
version = "1.0.0"
description = "CAD FastAPI Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.0,<2.3.0",
    "numpy>=1.26.0,<2.0.0",
    "cad-data-quality>=1.0.0",
    "cad-feature-engine>=1.0.0",
    "cad-model-pool>=1.0.0",
    "cad-fusion-engine>=1.0.0",
    "cad-explainer>=1.0.0",
    "cad-degradation>=1.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "python-json-logger>=0.1.11",
    "gmssl>=3.2.0,<4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
