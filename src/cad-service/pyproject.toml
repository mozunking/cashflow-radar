[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-service"
version = "1.0.0"
description = "CAD FastAPI Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.0,<2.3.0",
    "numpy>=1.26.0,<2.0.0",
    "cad-data-quality @ file:///${PROJECT_ROOT}/src/cad-data-quality",
    "cad-feature-engine @ file:///${PROJECT_ROOT}/src/cad-feature-engine",
    "cad-model-pool @ file:///${PROJECT_ROOT}/src/cad-model-pool",
    "cad-fusion-engine @ file:///${PROJECT_ROOT}/src/cad-fusion-engine",
    "cad-explainer @ file:///${PROJECT_ROOT}/src/cad-explainer",
    "cad-degradation @ file:///${PROJECT_ROOT}/src/cad-degradation",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
