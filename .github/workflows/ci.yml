name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: Install lint tools
        run: pip install black isort pyright
        
      - name: Run Black
        run: black --check src/
        
      - name: Run isort
        run: isort --check-only src/

  test:
    name: Unit Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cad_data_quality, cad_feature_engine, cad_model_pool, cad_fusion_engine, cad_explainer, cad_degradation]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-asyncio httpx pandas numpy pyod networkx scikit-learn
          
      - name: Run tests
        run: PYTHONPATH=src pytest src/${{ matrix.module }}/tests -v --cov=src/${{ matrix.module }}

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}/cad_service:${{ github.sha }}

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check docs exist
        run: |
          test -f docs/design/SK.md
          test -f docs/development/SK.md
          test -f docs/technical/SK.md

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run bandit
        run: pip install bandit && bandit -r src/ -f json || true
