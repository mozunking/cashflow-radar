name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          pip install black isort pyright pytest pytest-cov
          pip install -r src/requirements.txt
          
      - name: Run Black
        run: |
          black --check src/
          
      - name: Run isort
        run: |
          isort --check-only src/
          
      - name: Run Pyright
        run: |
          pyright src/

  test:
    name: Unit Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cad-data-quality, cad-feature-engine, cad-model-pool, cad-fusion-engine, cad-explainer, cad-degradation, cad-service]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -e src/${{ matrix.module }}
          
      - name: Run tests
        run: |
          PYTHONPATH=src pytest src/${{ matrix.module }}/tests -v --cov=src/${{ matrix.module }} || true
          
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.module }}
          path: .coverage

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/cad-service:${{ github.sha }}
            ghcr.io/${{ github.repository }}/cad-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check docs exist
        run: |
          echo "Checking documentation..."
          test -f docs/design/SK.md
          test -f docs/development/SK.md
          test -f docs/technical/SK.md
          test -f docs/testing/SK.md
          test -f docs/deployment/SK.md

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run safety check
        run: |
          pip install safety
          safety check --file src/requirements.txt || true
          
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r src/ -f json || true
